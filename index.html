<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Expense & Budget Visualizer</title>

    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <header>
        <div>
            <h1>Expense & Budget Visualizer</h1>
            <p>Kelola dan pantau pengeluaran kamu dengan mudah.</p>
        </div>

        <button id="themeToggle" class="theme-button">
            🌙 Dark Mode
        </button>
    </header>

    <main>

        <section class="summary">

            <div class="card budget-card">
                <h3>Total Budget</h3>
                <p id="totalBudget">Rp0</p>
            </div>

            <div class="card expense-card">
                <h3>Total Pengeluaran</h3>
                <p id="totalExpense">Rp0</p>
            </div>

            <div class="card remaining-card">
                <h3>Sisa Budget</h3>
                <p id="remainingBudget">Rp0</p>
            </div>

        </section>

        <section class="form-section">

            <h2>Atur Budget</h2>

            <form id="budgetForm">

                <label for="budget">Total Budget</label>

                <input
                    type="number"
                    id="budget"
                    placeholder="Contoh: 1000000"
                    min="1"
                    required
                >

                <label for="limit">
                    Batas Peringatan Pengeluaran
                </label>

                <input
                    type="number"
                    id="limit"
                    placeholder="Contoh: 500000"
                    min="0"
                >

                <button type="submit">
                    Simpan Budget
                </button>

            </form>

        </section>

        <section class="form-section">

            <h2>Tambah Pengeluaran</h2>

            <form id="expenseForm">

                <label for="description">
                    Nama Pengeluaran
                </label>

                <input
                    type="text"
                    id="description"
                    placeholder="Contoh: Makan siang"
                    required
                >

                <label for="amount">
                    Jumlah
                </label>

                <input
                    type="number"
                    id="amount"
                    placeholder="Contoh: 25000"
                    min="1"
                    required
                >

                <label for="date">
                    Tanggal
                </label>

                <input
                    type="date"
                    id="date"
                    required
                >

                <label for="category">
                    Kategori
                </label>

                <select id="category" required>

                    <option value="">
                        Pilih kategori
                    </option>

                    <option value="Makanan">
                        Makanan
                    </option>

                    <option value="Transportasi">
                        Transportasi
                    </option>

                    <option value="Belanja">
                        Belanja
                    </option>

                    <option value="Hiburan">
                        Hiburan
                    </option>

                    <option value="Tagihan">
                        Tagihan
                    </option>

                    <option value="Lainnya">
                        Lainnya
                    </option>

                </select>

                <button type="submit">
                    Tambah Pengeluaran
                </button>

            </form>

        </section>

        <section class="transaction-section">

            <div class="section-header">

                <h2>Daftar Pengeluaran</h2>

                <select id="sortSelect">

                    <option value="newest">
                        Terbaru
                    </option>

                    <option value="highest">
                        Jumlah Terbesar
                    </option>

                    <option value="lowest">
                        Jumlah Terkecil
                    </option>

                    <option value="category">
                        Berdasarkan Kategori
                    </option>

                </select>

            </div>

            <div id="transactionList">
                <p>Belum ada pengeluaran.</p>
            </div>

        </section>

        <section class="chart-section">

            <h2>Visualisasi Pengeluaran</h2>

            <div class="chart-container">

                <div id="expenseChart" class="donut-chart">
                    <span>Belum ada data</span>
                </div>

                <div id="chartLegend" class="chart-legend"></div>

            </div>

        </section>

    </main>

    <script src="js/script.js"></script>

</body>

</html>
